spring.application.name=parking
server.port=8082

spring.datasource.url=jdbc:h2:mem:parkingdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.kafka.bootstrap-servers=${KAFKA_SERVER_PARKING:localhost:9092}
spring.kafka.consumer.group-id=parking-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spotter.service-url=${SPOTTER_SERVICE_URL:http://localhost:8085/api/spotter}
account.service-url=${ACCOUNT_SERVICE_URL:http://localhost:8081/accounts}
